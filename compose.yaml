services:
  orders-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: ${ORDERS_DB_USER:-orders}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:-orders}
    ports:
      - "5432:5432"
    volumes:
      - orders-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://orders-db:5432/orders
      DB_USERNAME: ${ORDERS_DB_USER:-orders}
      DB_PASSWORD: ${ORDERS_DB_PASSWORD:-orders}
    ports:
      - "8081:8081"
    depends_on:
      orders-db:
        condition: service_healthy

volumes:
  orders-data:
